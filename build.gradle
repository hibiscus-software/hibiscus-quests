plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.39'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

// Full version is <mod_version>+<minecraft_version>, e.g. 1.0.0+26.3 (SemVer build metadata).
version = "${mod_version}+${minecraft_version}"
group = mod_group_id

// The public API (docs/API.md): task and reward type registries, queries, progress pushes and events that other mods
// compile against. It has its own source set so it cannot reference Hibiscus Quests internals; the mod jar includes
// its classes, and it is also published on its own as hibiscusquests-api, versioned by HibiscusQuestsApi.API_VERSION
// plus the Minecraft version.
sourceSets {
    // Sources in src/api/java (the source set's default).
    api {}
    main {
        compileClasspath += sourceSets.api.output
        runtimeClasspath += sourceSets.api.output
    }
    // Development only, never in a jar: the screenshot harness run by runScreenshotClient (see ScreenshotHarness).
    screenshots {
        compileClasspath += sourceSets.main.output + sourceSets.api.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.api.output + sourceSets.main.runtimeClasspath
    }
}

def apiVersion = (file('src/api/java/software/hibiscus/hibiscusquests/api/HibiscusQuestsApi.java').getText('UTF-8') =~ /API_VERSION = "([^"]+)"/)[0][1]
// The API uses Minecraft and NeoForge types, so each Minecraft version's branch builds its own jar of the same API
// version: hibiscusquests-api-1.0.0+26.3.jar here.
def apiArtifactVersion = "${apiVersion}+${minecraft_version}"

sourceSets.main.resources {
    srcDir('src/generated/resources')

    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    // Hibiscus Lib (docs/DEPENDING.md in its repository). GitHub Packages needs a token even for public packages.
    maven {
        name = 'HibiscusLib'
        url = 'https://maven.pkg.github.com/hibiscus-software/hibiscus-lib'
        credentials {
            // Locally: gpr.user / gpr.key in ~/.gradle/gradle.properties (a token with read:packages).
            // In GitHub Actions: GITHUB_ACTOR and HIBISCUS_PACKAGES_TOKEN (the organisation's read:packages token), else
            // GITHUB_TOKEN. The release job needs both: one to read Lib, its own token to publish this mod's packages.
            username = providers.gradleProperty('gpr.user').orElse(providers.environmentVariable('GITHUB_ACTOR')).getOrNull()
            password = providers.gradleProperty('gpr.key').orElse(providers.environmentVariable('HIBISCUS_PACKAGES_TOKEN'))
                    .orElse(providers.environmentVariable('GITHUB_TOKEN')).getOrNull()
        }
        content { includeGroup 'software.hibiscus.hibiscuslib' }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users in 26.3, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Hibiscus Lib's gametests run alongside ours, so a change here can't quietly break what Lib promises.
def gameTestNamespaces = "${mod_id},hibiscuslib"

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'

        workingDirectory project.layout.projectDirectory.dir('run').dir(name)

        modSource project.sourceSets.main
        modSource project.sourceSets.api
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', gameTestNamespaces
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', gameTestNamespaces
        argument '--nogui'
    }

    // Launches GameTestServer, runs every registered gametest, then exits. The test book (the built-in demo data
    // pack, see QuestPacks) is switched on for it.
    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', gameTestNamespaces
        systemProperty 'hibiscusquests.gametest', 'true'
    }

    // Opens a flat creative world, puts every quest book screen state on screen at each GUI scale, saves screenshots
    // to run/screenshotClient/screenshots/, then quits. The README's images come from here.
    screenshotClient {
        runType 'client'
        modSource project.sourceSets.screenshots
        systemProperty 'hibiscusquests.screenshots', 'true'
        systemProperty 'hibiscusquests.gametest', 'true'
        programArguments.addAll '--width', '1280', '--height', '720'
    }

    clientData {
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

// Dependencies in localRuntime are available when running the game but are not published.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    apiCompileOnly "net.neoforged:neoforge:${neo_version}"
    // Passes the API's classes on to builds that include this one; the published jars already contain them, and file
    // dependencies aren't written to the POM.
    api files(sourceSets.api.output)
    // The whole library: button bar, GUI toolkit, helpers and the Teams API. Loaded as a mod in dev runs.
    implementation "software.hibiscus.hibiscuslib:hibiscuslib:${hibiscuslib_version}"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : project.version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

// The API on its own, for other mods to compile against:
// software.hibiscus.hibiscusquests:hibiscusquests-api:<HibiscusQuestsApi.API_VERSION>+<minecraft_version>, with
// sources and javadoc.
def apiLicenseName = "LICENSE_${mod_id}"
def apiJar = tasks.register('apiJar', Jar) {
    archiveBaseName = "${mod_id}-api"
    archiveVersion = apiArtifactVersion
    from sourceSets.api.output
    from('LICENSE') { rename { apiLicenseName } }
}
def apiSourcesJar = tasks.register('apiSourcesJar', Jar) {
    archiveBaseName = "${mod_id}-api"
    archiveVersion = apiArtifactVersion
    archiveClassifier = 'sources'
    from sourceSets.api.allJava
}
def apiJavadoc = tasks.register('apiJavadoc', Javadoc) {
    source = sourceSets.api.allJava
    classpath = sourceSets.api.compileClasspath
    destinationDir = layout.buildDirectory.dir('docs/api-javadoc').get().asFile
    title = "Hibiscus Quests API ${apiVersion}"
    // Every API type and method must be documented: a missing or broken doc comment fails the build.
    options.addBooleanOption('Xdoclint:all', true)
    options.addBooleanOption('Werror', true)
    options.encoding = 'UTF-8'
}
def apiJavadocJar = tasks.register('apiJavadocJar', Jar) {
    archiveBaseName = "${mod_id}-api"
    archiveVersion = apiArtifactVersion
    archiveClassifier = 'javadoc'
    from apiJavadoc
}
tasks.named('assemble') { dependsOn apiJar }
tasks.named('check') { dependsOn apiJavadoc }

// Sources for the mod jar too, so mods depending on it get them in their IDE.
java {
    withSourcesJar()
}
tasks.named('sourcesJar', Jar).configure {
    from sourceSets.api.allJava
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = mod_id
            from components.java
            // Consumers have Minecraft and NeoForge already, so the POM lists no dependencies.
            pom.withXml { asNode().dependencies*.replaceNode {} }
        }
        // Compile-only for mods that add task or reward types, push progress or listen to events: no dependencies
        // in its POM.
        register('api', MavenPublication) {
            groupId = mod_group_id
            artifactId = "${mod_id}-api"
            version = apiArtifactVersion
            artifact apiJar
            artifact apiSourcesJar
            artifact apiJavadocJar
        }
    }
    repositories {
        // ./gradlew publishAllPublicationsToProjectRepository: a local file repo under repo/ (git-ignored).
        maven {
            name = 'project'
            url = "file://${project.projectDir}/repo"
        }
        // release.yml publishes here with GITHUB_TOKEN; see docs/RELEASING.md and docs/DEPENDING.md.
        maven {
            name = 'GitHubPackages'
            url = "https://maven.pkg.github.com/${github_repository}"
            credentials {
                username = providers.environmentVariable('GITHUB_ACTOR').orNull
                password = providers.environmentVariable('GITHUB_TOKEN').orNull
            }
        }
    }
}

// No Gradle module metadata: it would list NeoForge as a dependency, which consumers already have (the POMs leave
// dependencies out for the same reason).
tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
}

// Ship the MIT license inside the mod jar.
tasks.named('jar', Jar).configure {
    def licenseName = "LICENSE_${mod_id}"
    // The API's classes are part of the mod at runtime.
    from sourceSets.api.output
    from('LICENSE') {
        rename { licenseName }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    # Hibiscus Lib comes from GitHub Packages, which needs a token even for public packages: the organisation's
    # HIBISCUS_PACKAGES_TOKEN (read:packages) if it's set, else this workflow's own token.
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      HIBISCUS_PACKAGES_TOKEN: ${{ secrets.HIBISCUS_PACKAGES_TOKEN || github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # This is needed to be able to run ./gradlew below
      # You can run `git update-index --chmod +x gradlew` then remove this step.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # The mod jar, the API jar, and the API's Javadoc check (every API type and method documented).
      - name: Build with Gradle
        run: ./gradlew build

      # The same game tests release.yml runs (Hibiscus Quests' and Hibiscus Lib's), so a failure shows up here rather
      # than on a pushed tag.
      - name: Run game tests
        run: ./gradlew runGameTestServer

      # Every build's jars, downloadable from the run's Summary page for 30 days.
      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: hibiscusquests-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
